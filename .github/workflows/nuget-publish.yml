on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:

    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x.x

    ################################
    #  BUILD
    - name: Restore dependencies
      run: |
        cd src
        dotnet restore

    - name: Build
      run: |
        cd src
        dotnet build -c Release --no-restore

    #- name: Test
    #  run: dotnet test --no-build --verbosity normal

    #- name: Upload
    #  uses: actions/upload-artifact@v4.3.4
    #  with:
    #    name: 'nuget'
    #    path: 'src/**/Release/*.nupkg'
    #    retention-days: ${{  env.artifact-retention-days  }}

    - name: ls
      run: ls -lR

    ################################
    #  NUGET
    - name: Trusted Publishing (id-token permission required)
      uses: NuGet/login@v1
      id: login  # --> ${{ steps.login.outputs.NUGET_API_KEY }}
      with:
        user: ${{ secrets.NUGET_LOGIN }}

    - name: NuGet Publish
      run: |
        cd ./src
        dotnet nuget push "**/Release/*.nupkg"  \
          -k ${{ steps.login.outputs.NUGET_API_KEY }}  \
          -s https://api.nuget.org/v3/index.json \
          --timeout 60
        cd ..
